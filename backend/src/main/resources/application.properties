
spring.application.name=sonido-vivo-backend
server.port=8080

# Configuracion de MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonido_vivo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Configuracion JWT
app.jwt.secret=${JWT_SECRET:SonidoVivoJwtSecretKey2026_ChangeThisToA32ByteMinimumSecret}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
